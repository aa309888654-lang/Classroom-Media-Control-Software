# 一键构建 macOS 版（在 GitHub 网页走到 Actions → build-mac → Run workflow）
# 原因：macOS 安装包（dmg/zip）无法在 Windows 本机产品，必须在 macOS 环境/CI 构建。
name: build-mac

on:
  workflow_dispatch:

# macOS runner 按分钟计费：重复触发时直接取消旧的，不排队叠加
concurrency:
  group: build-mac
  cancel-in-progress: true

# 需要 contents: write：最后一步把 macOS 包直接传进 Release。
# 为什么不从本机下载 Actions 产物再上传？产物落在 Azure Blob（美国西部），
# 国内单连接只有 ~35KB/s，1GB 要下 8 小时；跑道直传不受这个限制。
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装依赖
        working-directory: app
        run: npm ci || npm install

      - name: 构建 macOS（Apple Silicon + Intel）
        working-directory: app
        run: npx electron-builder --mac --publish never

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: xiaotian-aigc-mac
          path: 软件封装/*.zip
          retention-days: 14

      # 跑道直传 Release：省掉「本机从 Azure Blob 下 1GB」这一步
      # GitHub 会剥掉资产名里的非 ASCII 字符，小天AIGC-… 会被截成 AIGC-…，
      # 所以资产名统一用拼音 ASCII（xiaotian-aigc-*），中文原名放进 label。
      - name: 传进 Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./app/package.json').version")
          TAG="v${VER}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "小天AIGC ${TAG}" --generate-notes --target "$GITHUB_SHA"
          fi
          # 注意：gh release view --json assets 里的 .id 是 GraphQL node id（RA_…），
          # 不是 REST 用的数字 id，直接拼 URL 会 404。数字 id 要走 REST 接口取。
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          for f in 软件封装/*.zip; do
            orig=$(basename "$f")
            base="${orig%.zip}"
            tail_name=$(echo "$base" | sed -E 's/^小天AIGC-([0-9.]+-)?//')
            ascii="xiaotian-aigc-${tail_name}.zip"
            dir=$(dirname "$f")
            cp "$f" "$dir/$ascii"
            gh release upload "$TAG" "$dir/$ascii" --clobber --repo "$GITHUB_REPOSITORY"
            rm -f "$dir/$ascii"
            aid=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" \
              --jq ".[] | select(.name == \"$ascii\") | .id" | head -1)
            if [ -n "$aid" ]; then
              printf '{"label": "%s"}' "$orig" | \
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$aid" --input - \
                --jq '.name' || echo "  警告：label 设置失败（不影响上传）"
            fi
          done
          echo "--- Release 资产 ---"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" \
            --jq '.[] | "\(.name)  [\(.label)]  \(.state)"'
