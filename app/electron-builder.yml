appId: com.xiaotian.aigc
productName: 小天AIGC
directories:
  output: ../软件封装
  buildResources: build
files:
  - src/**/*
  - package.json
  # GAP-08：排除 .mimosa 缓存目录（上传快照等临时产物），不随包分发
  - "!src/**/.mimosa/**"
# ffmpeg 二进制必须解出 asar（asar 内的文件无法 spawn 执行）；转码全格式兼容依赖它
asarUnpack:
  - node_modules/ffmpeg-static/**
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
      - "!**/.mimosa/**"   # GAP-08：resources 下同样剔除 .mimosa 缓存
win:
  icon: resources/icon.png
  # ---- 代码签名（未配置时照常构建，但产物未签名）----
  # Win11 开着「智能应用控制」的机器会硬拦未签名程序，且没有“仍要运行”可点，
  # 必须签名才能分发。首选零配置的环境变量方式，拿到证书后不用改本文件：
  #   $env:CSC_LINK="C:\cert\code-sign.pfx"; $env:CSC_KEY_PASSWORD="…"; npm run dist
  # 不想每次设环境变量时才解开下面这段（certificateFile 不存在会导致构建直接失败，
  # 这是有意为之：宁可不发布，也不要悄悄产出一个未签名的包）：
  # signtoolOptions:
  #   certificateFile: certs/code-sign.pfx
  #   certificatePassword: ${env.CSC_KEY_PASSWORD}
  #   signingHashAlgorithms: [sha256]
  #   timeStampServer: http://timestamp.digicert.com
  # 微软云签名（beta）替代方案见《签名与发布指南.md》第三节
  # 构建完务必跑 npm run dist:verify 复验（含 zip 内的 ffmpeg.exe）
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # 绿色解压版：解压一次到电脑/U盘，之后双击 小天AIGC.exe 秒开（~1.3 秒）。
    # 低性能教室机推荐用此版或安装版——便携版每次启动都要自解压 ~500MB，慢机要等 1 分钟
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 小天AIGC
  artifactName: 小天AIGC-Setup-${version}.exe
portable:
  artifactName: 小天AIGC-Portable-${version}.exe
# 说明：macOS 安装包（dmg/zip）需在 macOS 主机或云端 macOS runner 构建（见 .github/workflows/build-mac.yml）
mac:
  icon: resources/icon.png
  target:
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.education
  extendInfo:
    # PPT 放映控制走 AppleScript（osascript 驱动 PowerPoint for Mac），
    # 没有这条声明 macOS 会直接拒绝 AppleEvents 而不弹授权框
    NSAppleEventsUsageDescription: 小天AIGC 需要通过“自动化”权限控制 PowerPoint 放映（开始/翻页/退出）。
