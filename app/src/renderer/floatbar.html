<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PPT 悬浮控制条</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    /* 收起态：右下角一个半透明小圆点 */
    #dot { position: fixed; right: 10px; bottom: 10px; width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255,255,255,.35); border: 1px solid rgba(255,255,255,.25); }
    /* 展开态：无边框半透明按钮条 */
    #bar { position: fixed; right: 8px; bottom: 8px; display: none; gap: 8px;
      padding: 8px 10px; border-radius: 999px;
      background: rgba(12,16,24,.55); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.18); }
    body.open #dot { display: none; }
    body.open #bar { display: flex; }
    #bar button {
      width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
      background: rgba(255,255,255,.12); color: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s ease, transform .1s ease;
    }
    #bar button:hover { background: rgba(255,255,255,.28); }
    #bar button:active { transform: scale(0.92); }
    #bar button.danger { background: rgba(208,52,52,.55); }
    #bar button.danger:hover { background: rgba(208,52,52,.85); }
  </style>
</head>
<body>
  <div id="dot" title="PPT 控制"></div>
  <div id="bar">
    <button id="bPrev" title="上一页" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2.5v12H6zM18 6l-8.5 6L18 18z"/></svg>
    </button>
    <button id="bMusic" title="音乐 播放/暂停" type="button">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
    </button>
    <button id="bNext" title="下一页" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 6v12H18V6zM6 6l8.5 6L6 18z"/></svg>
    </button>
    <button id="bExit" class="danger" title="退出放映" type="button">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
    </button>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    $('bPrev').onclick = () => window.api.invoke('ppt:prev');
    $('bNext').onclick = () => window.api.invoke('ppt:next');
    $('bExit').onclick = () => window.api.invoke('ppt:exit');
    $('bMusic').onclick = () => window.api.invoke('floatbar:music');
  </script>
</body>
</html>
