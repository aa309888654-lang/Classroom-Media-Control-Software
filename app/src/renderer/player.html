<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>视频投放</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    /* 左上角滑出式关闭钮：默认隐藏；鼠标靠近左上角热区才显现，闲置自动隐藏 */
    #vClose { position: fixed; top: 2.4vh; left: 2vw; width: 56px; height: 56px; border-radius: 50%;
      background: rgba(10,16,28,.5); color: #fff; border: 1px solid rgba(255,255,255,.35);
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 30;
      opacity: 0; pointer-events: none; transition: opacity .3s ease, background .18s ease; backdrop-filter: blur(4px); }
    #vClose:hover { background: rgba(208,52,52,.78); }
    body.v-ui #vClose { opacity: 1; pointer-events: auto; }

    /* 底部控制条：进度条 + 播放/暂停 + 时间 + 音量 + 全屏/窗口切换；靠近底部显现，闲置自动隐藏 */
    #vBar { position: fixed; left: 50%; bottom: 2.6vh; transform: translateX(-50%);
      width: min(88vw, 760px); box-sizing: border-box;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 12px;
      background: rgba(10,16,28,.55); border: 1px solid rgba(255,255,255,.22);
      color: #fff; backdrop-filter: blur(6px); z-index: 30;
      opacity: 0; pointer-events: none; transition: opacity .3s ease; }
    body.v-ui #vBar { opacity: 1; pointer-events: auto; }
    #vBar button { background: none; border: none; color: #fff; cursor: pointer;
      width: 36px; height: 36px; border-radius: 8px; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center; transition: background .18s ease; }
    #vBar button:hover { background: rgba(255,255,255,.16); }
    #vBar .v-time { font-family: Consolas, Menlo, monospace; font-size: 12px;
      color: rgba(255,255,255,.85); flex: 0 0 auto; white-space: nowrap; user-select: none; }
    #vBar input[type="range"] { height: 4px; appearance: none; -webkit-appearance: none;
      background: rgba(255,255,255,.28); border-radius: 4px; outline: none; cursor: pointer; }
    #vBar input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%; background: #fff; border: none; }
    #vSeek { flex: 1; min-width: 0; }
    #vVol { flex: 0 0 86px; }
  </style>
</head>
<body>
  <video id="v"></video>
  <div id="vBar">
    <button id="vPlay" title="播放/暂停（空格）" type="button">
      <svg id="vPlayIco" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <span class="v-time" id="vTime">0:00 / 0:00</span>
    <input id="vSeek" type="range" min="0" max="1000" value="0" title="播放进度" />
    <button id="vVolBtn" title="音量" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <input id="vVol" type="range" min="0" max="100" value="100" title="音量" />
    <button id="vWin" title="窗口 / 全屏" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M16 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M8 20H5a1 1 0 0 1-1-1v-4"/></svg>
    </button>
  </div>
  <button id="vClose" title="停止投放（Esc）" type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
  </button>
  <script src="player.js"></script>
</body>
</html>
