<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>视频投放</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    /* 图片投放：整屏 contain 居中，黑边由背景补齐 */
    #img { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
    body.img-mode video { display: none; }
    body.img-mode #img { display: block; }
    body.img-mode #vBar { display: none; } /* 图片没有进度/音量，视频控制条整排隐藏 */
    /* 图片底部提示条：第几张 / 共几张 / 轮播状态 */
    #imgBar { position: fixed; left: 50%; bottom: 2.6vh; transform: translateX(-50%);
      display: none; align-items: center; gap: 14px; padding: 9px 16px; border-radius: 12px;
      background: rgba(10,16,28,.55); border: 1px solid rgba(255,255,255,.22); color: #fff;
      backdrop-filter: blur(6px); z-index: 30; opacity: 0; transition: opacity .3s ease;
      font-family: Consolas, Menlo, monospace; font-size: 12px; white-space: nowrap; }
    body.img-mode #imgBar { display: flex; }
    body.v-ui #imgBar { opacity: 1; }
    #imgBar button { background: none; border: none; color: #fff; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
    #imgBar button:hover { background: rgba(255,255,255,.16); }
    #imgBar .i-auto { font-family: inherit; }
    /* 左上角滑出式关闭钮：默认隐藏；鼠标靠近左上角热区才显现，闲置自动隐藏 */
    #vClose { position: fixed; top: 2.4vh; left: 2vw; width: 56px; height: 56px; border-radius: 50%;
      background: rgba(10,16,28,.5); color: #fff; border: 1px solid rgba(255,255,255,.35);
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 30;
      opacity: 0; pointer-events: none; transition: opacity .3s ease, background .18s ease; backdrop-filter: blur(4px); }
    #vClose:hover { background: rgba(208,52,52,.78); }
    body.v-ui #vClose { opacity: 1; pointer-events: auto; }

    /* 底部控制条：进度条 + 播放/暂停 + 时间 + 音量 + 全屏/窗口切换；靠近底部显现，闲置自动隐藏 */
    #vBar { position: fixed; left: 50%; bottom: 2.6vh; transform: translateX(-50%);
      width: min(94vw, 940px); box-sizing: border-box;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 12px;
      background: rgba(10,16,28,.55); border: 1px solid rgba(255,255,255,.22);
      color: #fff; backdrop-filter: blur(6px); z-index: 30;
      opacity: 0; pointer-events: none; transition: opacity .3s ease; }
    body.v-ui #vBar { opacity: 1; pointer-events: auto; }
    #vBar button { background: none; border: none; color: #fff; cursor: pointer;
      width: 36px; height: 36px; border-radius: 8px; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center; transition: background .18s ease; }
    #vBar button:hover { background: rgba(255,255,255,.16); }
    #vBar .v-time { font-family: Consolas, Menlo, monospace; font-size: 12px;
      color: rgba(255,255,255,.85); flex: 0 0 auto; white-space: nowrap; user-select: none; }
    #vBar input[type="range"] { height: 4px; appearance: none; -webkit-appearance: none;
      background: rgba(255,255,255,.28); border-radius: 4px; outline: none; cursor: pointer;
      min-width: 0; }
    #vBar input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%; background: #fff; border: none; }
    #vSeek { flex: 1; min-width: 0; }
    #vVol { flex: 0 0 86px; }
  </style>
</head>
<body>
  <video id="v"></video>
  <img id="img" alt="" />
  <div id="imgBar">
    <button id="imgPrev" title="上一张（←）" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span id="imgInfo">1 / 1</span>
    <button id="imgNext" title="下一张（→）" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button id="imgAuto" class="i-auto" title="自动轮播开关" type="button">自动轮播：关</button>
  </div>
  <div id="vBar">
    <button id="vBack" title="后退 10 秒（←）" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17 6 12l5-5"/><path d="M18 17l-5-5 5-5"/></svg>
    </button>
    <button id="vPlay" title="播放/暂停（空格）" type="button">
      <svg id="vPlayIco" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="vFwd" title="前进 10 秒（→）" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 7 5 5-5 5"/><path d="m6 7 5 5-5 5"/></svg>
    </button>
    <span class="v-time" id="vTime">0:00 / 0:00</span>
    <input id="vSeek" type="range" min="0" max="1000" value="0" title="播放进度" />
    <button id="vVolDown" title="音量 -5%（↓）" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M17 12h4"/></svg>
    </button>
    <button id="vVolBtn" title="音量" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <input id="vVol" type="range" min="0" max="100" value="100" title="音量" />
    <button id="vVolUp" title="音量 +5%（↑）" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M17 12h4"/><path d="M19 10v4"/></svg>
    </button>
    <button id="vWin" title="窗口 / 全屏" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M16 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M8 20H5a1 1 0 0 1-1-1v-4"/></svg>
    </button>
  </div>
  <button id="vClose" title="停止投放（Esc）" type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
  </button>
  <script src="player.js"></script>
</body>
</html>
